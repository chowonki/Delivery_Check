<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탁송체크 · 차량 조회</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7f5}nav{height:54px;display:flex;align-items:center;gap:20px;padding:0 20px;background:#fff;border-bottom:1px solid #dfe7e1}a{color:#254b3b;text-decoration:none;font-size:14px}a:focus-visible{outline:2px solid #254b3b}iframe{display:block;width:100%;height:calc(100dvh - 54px);border:0}</style></head><body><nav aria-label="기능 이동"><a href="./index.html">← 홈</a><a href="./dispatch.html" aria-current="page">탁송체크</a><a href="./transfer.html">하나은행 이체파일</a></nav><iframe src="./dispatch-tool.html?v=20261029-completed" title="탁송체크 차량 조회" allow="clipboard-write"></iframe><script>
(() => {
  const frame = document.querySelector('iframe');
  const status = document.createElement('div');
  status.setAttribute('role', 'status');
  status.setAttribute('aria-live', 'polite');
  status.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#254b3b;color:white;border-radius:10px;padding:12px 18px;z-index:1000;pointer-events:none';
  status.hidden = true;
  document.body.append(status);
  let timer;
  function notify(text) {
    clearTimeout(timer);
    status.textContent = text;
    status.hidden = false;
    timer = setTimeout(() => { status.hidden = true; }, 2200);
  }
  function setup() {
    const doc = frame.contentDocument;
    const body = doc && doc.getElementById('body');
    if (!body || body.dataset.individualCopy) return;
    body.dataset.individualCopy = 'true';
    // Choose the latest date across vendors and retain the full audit trail.
    const core = frame.contentWindow.DispatchCore;
    // Keep memo metadata in both the page reader and the isolated file worker.
    function installCarrierReader(core) {
      const readSheets = core.readSheets;
      core.readSheets = function(sheets, name) {
        const result = readSheets(sheets, name);
        const metadata = new Map();
        for (const record of result.records) {
          if (record.vendor !== 'C') continue;
          if (!metadata.has(record.sheet)) {
            const sheet = sheets.find(sheet => sheet.name === record.sheet);
            const clean = value => String(value ?? '').normalize('NFKC').replace(/\s+/g, '');
            const header = sheet?.rows.slice(0, 30).find(row => row.some(v => clean(v) === '출발지차량번호') && row.some(v => clean(v) === '운행상태'));
            const columns = header ? header.map((value, i) => /메모|비고|특이사항|전달사항|요청사항|요청내용|전달내용/.test(clean(value)) ? i : -1).filter(i => i >= 0) : [];
            metadata.set(record.sheet, {sheet, columns});
          }
          const {sheet, columns} = metadata.get(record.sheet);
          if (!sheet) continue;
          const raw = sheet.rows[record.row - (sheet.startRow ?? 1)] || [];
          record.memo = [...new Set(columns.map(i => String(raw[i] ?? '').trim()).filter(Boolean))].join(' · ');
          record.carrier = /캐리어/.test(record.memo);
        }
        return result;
      };
    }
    if (core) {
      installCarrierReader(core);
      const workerSource = doc.getElementById('worker-source');
      workerSource.textContent = '(' + installCarrierReader.toString() + ')(DispatchCore);\n' + workerSource.textContent;
    }
    if (core && !core._latestAcrossVendors) {
      const originalMatch = core.match;
      core.statuses.conflict = '최신일 금액 충돌';
      core.statuses.carrier = '캐리어';
      core.match = function(input, files) {
        const history = new Map();
        for (const file of files) for (const record of file.records || []) {
          if (!history.has(record.plate)) history.set(record.plate, []);
          history.get(record.plate).push(record);
        }
        const latest = new Map(), conflicts = new Map(), selectionReasons = new Map();
        for (const [plate, records] of history) {
          const dateOf = r => /^\d{4}-\d{2}-\d{2}$/.test(r.dispatchDate || '') ? r.dispatchDate : '';
          const date = records.reduce((max, r) => dateOf(r) > max ? dateOf(r) : max, '');
          const candidates = records.filter(r => dateOf(r) === date);
          let chosen = candidates[candidates.length - 1];
          // Same-day Openmile snapshots must not regress a completed job to an active state.
          // Keep newer dates and explicit cancellations as supplied by the source.
          if (date && chosen.vendor === 'B' && !core.complete(chosen) && !/취소|캔슬|cancel/i.test(String(chosen.state || ''))) {
            const completed = candidates.filter(r => r.vendor === 'B' && core.complete(r));
            if (completed.length) {
              chosen = completed[completed.length - 1];
              selectionReasons.set(plate, '동일 최신일 오픈마일 기록 중 완료 기록 우선 적용');
            }
          }
          latest.set(plate, chosen);
          const priced = candidates.filter(r => core.complete(r) && r.vendor !== 'C' && r.cost !== null && Number.isFinite(Number(r.cost)));
          if (new Set(priced.map(r => Number(r.cost))).size > 1) conflicts.set(plate, candidates);
        }
        return originalMatch(input, [{name:'최신 기록', records:[...latest.values()]}]).map(row => {
          const record = latest.get(row.plate), conflict = conflicts.get(row.plate);
          const carrierRecords = (history.get(row.plate) || []).filter(r => r.vendor === 'C' && r.carrier);
          const carrier = carrierRecords.length > 0;
          return {...row, latestRecord:record, recordHistory:history.get(row.plate) || [], latestConflict:!!conflict, selectionReason:selectionReasons.get(row.plate) || '', carrier, carrierMemo:carrierRecords.map(r=>r.memo).filter(Boolean).join(' · '),
            ...(conflict ? {status:'conflict', amount:null, meaning:'동일 최신일 금액 상이', sources:conflict.map(r => `${r.file} / ${r.sheet} / ${r.row}행`).join('; ')} : {}),
            ...(carrier ? {status:'carrier', amount:null, cInquiry:false, meaning:'캐리어', sources:carrierRecords.map(r=>`${r.file} / ${r.sheet} / ${r.row}행`).join('; ')} : {})};
        });
      };
      core._latestAcrossVendors = true;
    }

    const style = doc.createElement('style');
    style.textContent = '.cell-copy{display:inline-block;border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;padding:4px 0;cursor:pointer;text-align:inherit;border-radius:4px}.cell-copy:hover{text-decoration:underline;text-underline-offset:4px}.cell-copy:focus-visible{outline:2px solid #397956;outline-offset:4px}';
    doc.head.append(style);
    function decorate() {
      body.querySelectorAll('td.plate,td.amount').forEach(cell => {
        if (cell.querySelector('.cell-copy')) return;
        const isAmount = cell.classList.contains('amount');
        let value = cell.textContent.trim();
        if (isAmount) {
          value = value.replace(/,/g, '');
          if (!/^-?\d+(?:\.\d+)?$/.test(value)) return;
        } else if (!value || value === '—') return;
        const button = doc.createElement('button');
        button.type = 'button';
        button.className = 'cell-copy';
        button.textContent = value;
        button.dataset.copyValue = value;
        const label = isAmount ? '금액' : '차량번호';
        button.title = label + ' 복사: ' + value;
        button.setAttribute('aria-label', label + ' ' + value + ' 복사');
        cell.replaceChildren(button);
      });
    }
    async function copyValue(value) {
      try {
        if (!navigator.clipboard || !window.isSecureContext) throw new Error('fallback');
        await navigator.clipboard.writeText(value);
      } catch {
        const text = doc.createElement('textarea');
        const focused = doc.activeElement;
        text.value = value;
        text.style.cssText = 'position:fixed;left:-9999px;top:0';
        doc.body.append(text);
        try {
          text.focus(); text.select(); text.setSelectionRange(0, value.length);
          if (!doc.execCommand('copy')) throw new Error('copy failed');
        } finally {
          text.remove();
          if (focused && focused.focus) focused.focus({preventScroll:true});
        }
      }
    }
    body.addEventListener('click', async event => {
      const button = event.target.closest('.cell-copy');
      if (!button || !body.contains(button)) return;
      try {
        await copyValue(button.dataset.copyValue);
        notify(button.dataset.copyValue + ' 복사 완료');
      } catch {
        notify('복사하지 못했습니다. 브라우저의 클립보드 권한을 확인해 주세요.');
      }
    });
    const app = frame.contentWindow.DispatchApp;
    if (!core || !app) return;
    const $ = id => doc.getElementById(id);
    const selected = new Set(), processed = new Set();
    const key = r => JSON.stringify([r.plate,r.dispatchDate,r.amount,r.sources,r.status]);
    const originalIncludes = core.includes;
    let processing = 'all', carrierFilter = 'all', summaryFilter = null;
    const originalNotes = core.notes, originalValues = core.values;
    core.notes = r => [originalNotes(r), r.carrier ? '캐리어' : '', r.carrierMemo || ''].filter(Boolean).join(' · ');
    core.values = r => {const values=originalValues(r);values[8]=core.notes(r);return values;};
    core.textExport = rows => '\ufeff' + [core.headers, ...core.unique(rows).map(core.values)].map(row => row.map(v => String(v ?? '').replace(/[\t\r\n]/g,' ')).join('\t')).join('\r\n');

    core.includes = (r, filter) => { filter=summaryFilter || filter; return (filter === 'progress' ? (r.rawStates || []).includes('탁송 중') : filter === 'carrier' ? !!r.carrier : originalIncludes(r, filter)) && (carrierFilter === 'all' || !!r.carrier === (carrierFilter === 'carrier')) && (processing === 'all' || processed.has(key(r)) === (processing === 'done')); };
    // Use the existing confirmed list for completed vehicles; keep its matching rules.
    core.statuses.confirmed = '완료차량';
    const completedStat = doc.querySelector('.stats [data-filter="confirmed"]');
    completedStat.querySelector('span').textContent = '완료차량';
    const completedDot = doc.createElement('i');completedDot.className='dot green';
    completedStat.querySelector('span').prepend(completedDot);
    doc.querySelector('.tabs [data-filter="confirmed"]').textContent = '완료차량';
    // The original renderer still writes statMissing, so retain its hidden counter.
    doc.querySelector('.stats [data-filter="missing"]').style.display = 'none';
    doc.querySelector('.tabs [data-filter="missing"]').remove();
    $('scope').querySelector('[value="confirmed"]').textContent = '완료차량';
    const progressStat = doc.createElement('button');
    progressStat.type='button';progressStat.className='stat';progressStat.id='progressStat';
    progressStat.innerHTML='<span><i class="dot orange"></i>진행 중</span><strong id="statProgress">0<small>대</small></strong>';
    progressStat.setAttribute('aria-label','진행 중 차량 0대 보기');
    doc.querySelector('.stats').append(progressStat);
    progressStat.dataset.filter='progress';
    const carrierStat=doc.createElement('button');
    carrierStat.type='button';carrierStat.className='stat';carrierStat.dataset.filter='carrier';
    carrierStat.innerHTML='<span>캐리어차량</span><strong id="statCarrier">0<small>대</small></strong>';
    const stats=doc.querySelector('.stats'),tabs=doc.querySelector('.tabs');
    const allStat=stats.querySelector('[data-filter="all"]'),jejuStat=stats.querySelector('[data-filter="jeju"]');
    allStat.querySelector('span').textContent='전체차량';
    jejuStat.querySelector('span').textContent='제주차량';
    stats.append(allStat,progressStat,completedStat,jejuStat,carrierStat);
    const progressTab=doc.createElement('button'),carrierTab=doc.createElement('button');
    for(const [button,filter,label] of [[progressTab,'progress','진행 중'],[carrierTab,'carrier','캐리어차량']]){
      button.type='button';button.className='tab';button.dataset.filter=filter;button.textContent=label;
    }
    const allTab=tabs.querySelector('[data-filter="all"]'),completedTab=tabs.querySelector('[data-filter="confirmed"]'),jejuTab=tabs.querySelector('[data-filter="jeju"]');
    allTab.textContent='전체차량';jejuTab.textContent='제주차량';
    tabs.prepend(allTab,progressTab,completedTab,jejuTab,carrierTab);
    for(const button of doc.querySelectorAll('[data-filter]')){
      if([progressStat,carrierStat,progressTab,carrierTab].includes(button))continue;
      const original=button.onclick;
      button.onclick=event=>{summaryFilter=null;return original?.call(button,event);};
    }
    const activateFilter=filter=>{
      allTab.click();summaryFilter=filter;
      $('stateFilter').value='all';
      carrierFilter='all';$('carrierFilter').value='all';
      doc.querySelectorAll('[data-filter]').forEach(button=>{
        button.classList.toggle('active',button.dataset.filter===filter);
        button.setAttribute('aria-pressed',String(button.dataset.filter===filter));
      });
    };
    for(const button of [progressStat,carrierStat,progressTab,carrierTab]){
      button.onclick=()=>{activateFilter(button.dataset.filter);redraw();};
    }
    const extraStyle = doc.createElement('style');
    extraStyle.textContent = 'button:disabled,input:disabled,select:disabled{cursor:default}body.busy button:disabled{cursor:progress}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}.dispatch-tools{padding:16px;border-bottom:1px solid #e2e9e4;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.dispatch-tools .hint{font-size:12px;color:#607477;width:100%}.dispatch-tools select{max-width:100%;padding:8px}.dispatch-totals{font-weight:650;width:100%;font-size:13px;line-height:1.8}.dispatch-check{width:18px;height:18px;accent-color:#397956;cursor:pointer}.dispatch-selected{background:#edf8f1}.dispatch-processed .plate{text-decoration:line-through;color:#73847a}.badge.carrier{background:#edf0ff;color:#4a4090}.badge.conflict{background:#fff0ed;color:#b42318}.record-history{min-width:190px;max-width:320px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7}.record-history p{margin:8px 0}.dispatch-tools button{white-space:normal}';
    doc.head.append(extraStyle);
    const tools = doc.createElement('div');tools.className='dispatch-tools';
    tools.innerHTML='<label>캐리어 분류 <select id="carrierFilter"><option value="all">전체 분류</option><option value="carrier">캐리어만</option><option value="other">캐리어 제외</option></select></label><label>처리 상태 <select id="processingFilter"><option value="all">전체</option><option value="pending">미처리만</option><option value="done">처리 완료만</option></select></label><button type="button" id="selectedPlates" class="button compact">선택 차량번호 복사</button><button type="button" id="selectedAmounts" class="button compact">선택 차량번호+금액 복사</button><button type="button" id="markDone" class="button compact">선택 처리 완료</button><button type="button" id="markPending" class="button compact">선택 미처리로</button><button type="button" id="copyInquiry" class="button compact">렌톡 문의 목록 복사</button><div id="dispatchTotals" class="dispatch-totals" role="status"></div><div class="hint">체크박스는 차량번호 단위로 선택합니다. 전체 선택·선택 저장은 현재 필터에 맞는 차량 기준입니다. 선택 저장은 하단 저장 범위에서 「선택한 차량」을 고르세요. 렌톡 메모·비고 등에 「캐리어」가 포함된 차량은 완료 여부와 무관하게 분류하며 렌톡 문의 목록에서는 제외합니다. 처리 표시는 현재 페이지에서만 유지되며 전체 초기화 시 지워집니다.</div>';
    doc.querySelector('.resulthead').after(tools);
    const clearList = doc.createElement('button');clearList.type='button';clearList.className='button';clearList.textContent='차량목록만 초기화';clearList.id='clearVehicleList';$('reset').before(clearList);
    const selectedOption = doc.createElement('option');selectedOption.value='selected';selectedOption.textContent='선택한 차량';$('scope').append(selectedOption);
    const head = doc.querySelector('#table thead tr');
    const selectHead = doc.createElement('th');selectHead.innerHTML='<input type="checkbox" id="selectVisibleVehicles" class="dispatch-check" aria-label="현재 표시 조건의 차량 전체 선택">';head.prepend(selectHead);
    for (const label of ['처리','조회 근거 / 이전 기록']) {const th=doc.createElement('th');th.textContent=label;head.append(th);}
    function visibleRows() {
      const q=core.plate($('search').value),vendor=$('vendorFilter').value,state=$('stateFilter').value,from=$('dateFrom').value,to=$('dateTo').value;
      const filter=doc.querySelector('.tabs [data-filter].active')?.dataset.filter || 'all';
      return core.unique(app.getResults().filter(r => core.includes(r,filter) && r.plate.includes(q) && (vendor==='all'||r.vendor.split(',').map(v=>v.trim()).includes(vendor)) && (state==='all'||(r.rawStates||[]).includes(state)) && (!from&&!to||(r.dispatchDates||[]).some(d=>(!from||d.slice(0,10)>=from)&&(!to||d.slice(0,10)<=to)))));
    }
    const selectedRows = () => visibleRows().filter(r=>selected.has(r.plate));
    const total = rows => rows.filter(r=>r.status==='confirmed'&&Number.isFinite(r.amount)).reduce((sum,r)=>sum+BigInt(r.amount),0n).toLocaleString('ko-KR');
    function redraw() {$('search').dispatchEvent(new frame.contentWindow.Event('input'));enhance();}
    function updateControls() {
      const visible=visibleRows(),rows=selectedRows(),all=core.unique(app.getResults());
      const completedCount=all.filter(r=>r.status==='confirmed').length;
      completedStat.setAttribute('aria-label','완료차량 '+completedCount+'대 보기');
      const progressCount=all.filter(r=>(r.rawStates||[]).includes('탁송 중')).length;
      $('statProgress').replaceChildren(doc.createTextNode(progressCount.toLocaleString('ko-KR')));
      const unit=doc.createElement('small');unit.textContent='대';$('statProgress').append(unit);
      progressStat.setAttribute('aria-label','진행 중 차량 '+progressCount+'대 보기');
      const activeFilter=doc.querySelector('.tabs [data-filter].active')?.dataset.filter || 'all';
      progressStat.classList.toggle('active',activeFilter==='progress');
      progressStat.setAttribute('aria-pressed',String(activeFilter==='progress'));
      progressStat.disabled=!progressCount;
      const carrierCount=all.filter(r=>r.carrier).length;
      $('statCarrier').replaceChildren(doc.createTextNode(carrierCount.toLocaleString('ko-KR')));
      const carrierUnit=doc.createElement('small');carrierUnit.textContent='대';$('statCarrier').append(carrierUnit);
      carrierStat.setAttribute('aria-label','캐리어차량 '+carrierCount+'대 보기');
      carrierStat.classList.toggle('active',activeFilter==='carrier');
      carrierStat.setAttribute('aria-pressed',String(activeFilter==='carrier'));
      carrierStat.disabled=!carrierCount;
      $('dispatchTotals').textContent=`완료차량 총액 ${total(all)}원 · 표시 ${visible.length}대 / ${total(visible)}원 · 선택 ${rows.length}대 / ${total(rows)}원 · 캐리어 ${all.filter(r=>r.carrier).length}대 · 처리 완료 ${all.filter(r=>processed.has(key(r))).length}대 (금액이 확인된 완료차량만 합산)`;
      const box=$('selectVisibleVehicles');box.disabled=!visible.length;box.checked=visible.length>0&&rows.length===visible.length;box.indeterminate=rows.length>0&&rows.length<visible.length;
      for (const id of ['selectedPlates','selectedAmounts','markDone','markPending']) $(id).disabled=!rows.length;
      $('copyInquiry').disabled=!visible.some(r=>r.cInquiry);
    }
    function recordText(r, chosen) {
      return `${chosen?'적용 기록':'이전 / 동시 기록'} · ${r.dispatchDate||'일자 없음'}\n${({A:'한빛탁송',B:'오픈마일',C:'렌톡'})[r.vendor]||r.vendor} · ${r.state||'상태 없음'} · ${r.cost==null?'금액 없음':String(r.cost)+'원'}\n${r.file||'파일명 없음'} / ${r.sheet||'시트 없음'} / ${r.row||'?'}행${r.memo?'\n메모: '+r.memo:''}${r.carrier?'\n분류: 캐리어':''}`;
    }
    function enhance() {
      const visible=visibleRows(),plates=new Set(visible.map(r=>r.plate));
      for (const plate of selected) if (!plates.has(plate)) selected.delete(plate);
      const byPlate=new Map(app.getResults().map(r=>[r.plate,r]));
      for (const tr of body.rows) {
        const plate=tr.querySelector('td.plate')?.textContent.trim(),r=byPlate.get(plate);if(!r)continue;
        if (!tr.dataset.enhanced) {
          tr.dataset.enhanced='true';
          const td=doc.createElement('td'),box=doc.createElement('input');box.type='checkbox';box.className='dispatch-check vehicle-select';box.setAttribute('aria-label',plate+' 선택');
          box.onchange=()=>{if(box.checked)selected.add(plate);else selected.delete(plate);enhance()};td.append(box);tr.prepend(td);
          const doneCell=doc.createElement('td'),done=doc.createElement('input');done.type='checkbox';done.className='dispatch-check vehicle-done';done.setAttribute('aria-label',plate+' 처리 완료');
          done.onchange=()=>{if(done.checked)processed.add(key(r));else processed.delete(key(r));redraw()};doneCell.append(done);tr.append(doneCell);
          const source=doc.createElement('td'),details=doc.createElement('details'),summary=doc.createElement('summary');summary.textContent=r.latestConflict?'금액 충돌 · 근거 보기':'조회 근거 ('+(r.recordHistory||[]).length+'건)';details.append(summary);details.className='record-history';
          if(r.selectionReason){const reason=doc.createElement('p');reason.textContent=r.selectionReason;details.append(reason);}
          if(r.latestConflict){const warning=doc.createElement('p');warning.textContent='같은 최신일의 완료 금액이 달라 자동 확정하지 않았습니다.';details.append(warning);}
          const history=r.recordHistory||[];
          if(!history.length){const p=doc.createElement('p');p.textContent='일치하는 원본 기록이 없습니다.';details.append(p);}
          history.slice().reverse().forEach(record=>{const p=doc.createElement('p');p.textContent=recordText(record,record===r.latestRecord&&!r.latestConflict);details.append(p)});source.append(details);tr.append(source);
        }
        tr.querySelector('.vehicle-select').checked=selected.has(plate);tr.querySelector('.vehicle-done').checked=processed.has(key(r));
        tr.classList.toggle('dispatch-selected',selected.has(plate));tr.classList.toggle('dispatch-processed',processed.has(key(r)));
      }
      updateControls();
    }
    $('selectVisibleVehicles').onchange=e=>{selected.clear();if(e.target.checked)visibleRows().forEach(r=>selected.add(r.plate));enhance()};
    $('carrierFilter').onchange=e=>{carrierFilter=e.target.value;selected.clear();doc.querySelector('.tabs [data-filter="all"]').click();redraw()};
    $('processingFilter').onchange=e=>{processing=e.target.value;selected.clear();redraw()};
    async function copyRows(rows,amounts=false) {
      if (!rows.length) {notify('복사할 차량이 없습니다.');return;}
      if(amounts&&rows.some(r=>r.status!=='confirmed'||r.amount==null)){notify('금액이 확인된 차량만 선택해 주세요.');return;}
      try {await copyValue(rows.map(r=>amounts?`${r.plate}\t${r.amount}`:r.plate).join('\n'));notify(rows.length+'대 복사 완료');}catch{notify('복사 권한을 확인해 주세요.');}
    }
    $('selectedPlates').onclick=()=>copyRows(selectedRows());$('selectedAmounts').onclick=()=>copyRows(selectedRows(),true);
    $('copyInquiry').onclick=()=>copyRows(visibleRows().filter(r=>r.cInquiry));
    for(const [id,value] of [['markDone',true],['markPending',false]]) $(id).onclick=()=>{for(const r of selectedRows()){if(value)processed.add(key(r));else processed.delete(key(r));}redraw()};
    clearList.onclick=()=>{
      if(doc.body.classList.contains('busy'))return;
      selected.clear();$('input').value='';$('input').dispatchEvent(new frame.contentWindow.Event('input'));
      $('search').value='';$('vendorFilter').value='all';$('stateFilter').value='all';$('dateFrom').value='';$('dateTo').value='';$('scope').value='confirmed';processing='all';carrierFilter='all';$('carrierFilter').value='all';$('processingFilter').value='all';
      doc.querySelector('.tabs [data-filter="all"]').click();$('input').focus();notify('차량목록을 비웠습니다. 업체 파일은 유지됩니다.');
    };
    const reset=$('reset').onclick;$('reset').onclick=()=>{reset();if(!app.getFiles().length&&!$('input').value){selected.clear();processed.clear();processing='all';carrierFilter='all';$('carrierFilter').value='all';$('processingFilter').value='all';$('dateFrom').value='';$('dateTo').value='';redraw()}};
    let exporting=false,exportSerial=0;
    doc.querySelectorAll('[data-export]').forEach(button=>{
      const original=button.onclick;
      button.onclick=async event=>{
        if($('scope').value!=='selected')return original.call(button,event);
        const rows=selectedRows();if(!rows.length){notify('저장할 차량을 선택해 주세요.');return;}
        if(exporting||doc.body.classList.contains('busy'))return;exporting=true;
        try {
          const type=button.dataset.export,blob=type==='txt'?new Blob([core.textExport(rows)],{type:'text/plain;charset=utf-8'}):type==='xlsx'?await app.excelBlob(rows):app.pdfBlob(rows);
          const url=URL.createObjectURL(blob),a=doc.createElement('a');a.href=url;a.download='탁송조회_선택_'+new Date().toLocaleString('sv-SE',{timeZone:'Asia/Seoul',hour12:false}).replace(/[-:]/g,'').replace(' ','_')+'_'+(++exportSerial)+'.'+type;doc.body.append(a);
          try{a.click()}finally{a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}notify(rows.length+'대 선택 저장 요청 완료');
        }catch(error){notify('저장하지 못했습니다: '+error.message)}finally{exporting=false;}
      };
    });
    new MutationObserver(enhance).observe(body,{childList:true});
    enhance();

    new MutationObserver(decorate).observe(body, {childList:true});
    decorate();
  }
  frame.addEventListener('load', setup);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete') setup();
})();
</script></body></html>
